[package]
name = "forge-ui"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
bytes = "1"
clap.workspace = true
forge-protocol = { version = "0.1.0", path = "../forge-protocol" }
forge-domain = { version = "0.1.0", path = "../forge-domain" }
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1.11.1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
nix = { version = "0.30", default-features = false, features = ["fs", "user"] }
percent-encoding = "2.3.2"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
subtle = "2"
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tower = { version = "0.5", features = ["util"] }
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
