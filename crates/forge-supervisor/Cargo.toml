[package]
name = "forge-supervisor"
default-run = "forge-supervisor"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
clap.workspace = true
forge-protocol = { path = "../forge-protocol" }
hyper-util = { version = "0.1", features = ["tokio"] }
nix = { version = "0.30", default-features = false, features = ["process", "signal", "user"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json", "env-filter"] }
tower = "0.5"
uuid.workspace = true
sha2 = "0.10"
forge-domain = { version = "0.1.0", path = "../forge-domain" }
time = { workspace = true, features = ["parsing"] }
prometheus-client = "0.25.1"
axum.workspace = true
forge-provider-codex = { version = "0.1.0", path = "../forge-provider-codex" }
forge-provider-common = { version = "0.1.0", path = "../forge-provider-common" }
forge-provider-claude = { version = "0.1.0", path = "../forge-provider-claude" }
