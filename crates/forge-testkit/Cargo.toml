[package]
name = "forge-testkit"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
async-nats.workspace = true
axum.workspace = true
forge-application = { path = "../forge-application" }
forge-core = { path = "../forge-core", features = ["test-support"] }
forge-domain = { path = "../forge-domain" }
forge-protocol = { path = "../forge-protocol" }
forge-storage = { path = "../forge-storage" }
forge-supervisor = { path = "../forge-supervisor" }
hyper-util = { version = "0.1", features = ["tokio"] }
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tower = "0.5"
uuid.workspace = true

[dev-dependencies]
sha2 = "0.10"
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
forge-cli = { path = "../forge-cli" }
forge-provider-codex = { path = "../forge-provider-codex" }
forge-provider-claude = { path = "../forge-provider-claude" }
forge-provider-common = { path = "../forge-provider-common" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream"] }
forge-provider-opencode = { path = "../forge-provider-opencode" }
time.workspace = true
object_store = "0.14.1"
tempfile = "3"
