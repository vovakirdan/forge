openapi: 3.1.0
info:
  title: Forge local control API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Local-only HTTP/JSON and SSE control contract for Forge.

    This API is served over an owner-only Unix domain socket, not a TCP
    listener. The nominal server URL only supplies an HTTP authority to generic
    OpenAPI clients. M0 has no application-level authentication: the local
    process is the sole operator. Every mutation is a named command, committed
    by Core, and requires an `Idempotency-Key` header plus an expected Project
    revision. The operator is recorded in canonical Events as a `human` actor;
    M0 defines no separate local-administrator actor kind.
servers:
  - url: http://forge.local
    description: Nominal HTTP authority carried over the local Unix socket.
x-forge-transport:
  kind: http-over-unix-domain-socket
  default_socket: "$XDG_RUNTIME_DIR/forge/api.sock"
  socket_resolution_order:
    - "$XDG_RUNTIME_DIR/forge/api.sock when XDG_RUNTIME_DIR is absolute"
    - "$XDG_STATE_HOME/forge/run/api.sock when XDG_STATE_HOME is absolute"
    - "$HOME/.local/state/forge/run/api.sock when HOME is absolute"
    - "/tmp/forge/api.sock"
  cwd_independent: true
  description: |
    Unset or relative environment directories are skipped. The same resolution
    applies to the local client default, so a caller never derives a socket
    path from its current working directory.
  tcp_listener: false
x-forge-authentication:
  kind: owner-only-unix-socket
  description: |
    M0 relies on a mode-0600 Unix socket owned by the local operator. It has no
    HTTP bearer token, API key, or caller identity; multi-user authentication is
    deliberately deferred. Core-to-Supervisor gRPC independently verifies peer
    credentials on its separate socket.
# OpenAPI security schemes describe HTTP headers/TLS, neither of which represents
# the local owner-only socket boundary. An explicit empty array avoids inventing
# a credential that clients must not send; the extension above is authoritative.
security: []
tags:
  - name: system
    description: Local Core readiness.
  - name: commands
    description: Audited named mutations applied only by Core.
  - name: projects
    description: Project control-state projections.
  - name: tasks
    description: Task projections and canonical Artifacts.
  - name: pipelines
    description: Immutable PipelineVersion projections.
  - name: runs
    description: Desired and observed execution-attempt projections.
  - name: events
    description: Replayable canonical Event stream.
  - name: inbox
    description: Durable Employee conversations; persistence is not runtime delivery.
paths:
  /v1/projects/{project_id}/hook-versions:
    get:
      tags: [projects]
      operationId: listProjectHookVersions
      summary: Read immutable owner-configured command versions; never execute them.
      parameters:
        - {name: project_id, in: path, required: true, schema: {$ref: '#/components/schemas/UuidV7'}}
        - {name: after, in: query, schema: {$ref: '#/components/schemas/UuidV7'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Ascending version-ID page. Names may repeat; Pipeline pins exact IDs.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ProjectHookVersionView'}}
                  next_cursor: {type: [string, 'null'], format: uuid}
        '400': {description: Invalid identifier, cursor or page limit.}
        '404': {description: Project absent.}
  /v1/projects/{project_id}/tasks/{task_id}/integrations:
    get:
      tags: [tasks]
      operationId: listGitIntegrations
      summary: Read retained local Git operations without issuing filesystem effects.
      parameters:
        - {name: project_id, in: path, required: true, schema: {$ref: '#/components/schemas/UuidV7'}}
        - {name: task_id, in: path, required: true, schema: {$ref: '#/components/schemas/UuidV7'}}
        - {name: after, in: query, schema: {$ref: '#/components/schemas/UuidV7'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Ascending operation-ID page; host paths and control payloads are excluded.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/GitIntegrationView'}}
                  next_cursor: {type: [string, 'null'], format: uuid}
        '400': {description: Invalid identifier, cursor or page limit.}
        '404': {description: Task absent from the requested Project.}
  /v1/projects/{project_id}/findings:
    get:
      tags: [tasks]
      operationId: listFindings
      summary: Read observations without changing backlog or triage.
      parameters:
        - {name: project_id, in: path, required: true, schema: {$ref: '#/components/schemas/UuidV7'}}
        - {name: task_id, in: query, schema: {$ref: '#/components/schemas/UuidV7'}}
        - {name: after, in: query, schema: {$ref: '#/components/schemas/UuidV7'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Ascending ID page; event timestamps remain the authoritative chronology.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/FindingView'}}
                  next_cursor: {type: [string, 'null'], format: uuid}
        '400': {description: Invalid query or identifier.}
        '404': {description: Project or requested source Task does not exist in scope.}
  /v1/projects/{project_id}/tasks/{task_id}/reviews:
    get:
      tags: [tasks]
      operationId: listCandidateReviews
      summary: Read immutable revision-bound Employee assessments.
      parameters:
        - {name: project_id, in: path, required: true, schema: {$ref: '#/components/schemas/UuidV7'}}
        - {name: task_id, in: path, required: true, schema: {$ref: '#/components/schemas/UuidV7'}}
        - {name: after, in: query, schema: {$ref: '#/components/schemas/UuidV7'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Descending record-ID page; recorded_at is authoritative time, not ID order.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/CandidateReviewRecord'}}
                  next_cursor: {type: [string, 'null'], format: uuid}
        '400': {description: Invalid bounded query or identifiers.}
        '404': {description: Task does not exist in this Project.}
  /v1/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Return local Core readiness without exposing credentials.
      responses:
        '200':
          description: Core is ready to accept local requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/commands/{name}:
    parameters:
      - $ref: '#/components/parameters/CommandName'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [commands]
      operationId: executeNamedCommand
      summary: Commit one named management command through Core.
      description: |
        `name` selects the corresponding typed `payload` schema. Core rejects a
        valid payload sent to the wrong path, a replay with a different body,
        and a stale `expected_revision`. The `human` actor is server-derived in
        M0; callers cannot supply an actor id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
      responses:
        '200':
          description: The command was committed or an idempotent result was replayed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/projects:
    parameters:
      - $ref: '#/components/parameters/PageCursor'
      - $ref: '#/components/parameters/PageLimit'
    get:
      tags: [projects]
      operationId: listProjects
      summary: List safe Project control projections in stable ID order.
      responses:
        '200':
          description: A bounded page of canonical Projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: getProject
      summary: Read the Project control state.
      responses:
        '200':
          description: Current canonical Project projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectView'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/projects/{projectId}/cancellation-reasons:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: getProjectCancellationReasons
      summary: Read active and retired cancellation reasons from one Project snapshot.
      description: No query parameters. Stable identifier order. Read-only; browser response limit is 64 KiB.
      responses:
        '200':
          description: Complete reason catalog with canonical Project revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCancellationReasonsView'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/projects/{projectId}/priority-scheme:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: getProjectPriorityScheme
      summary: Read every priority level from one canonical Project snapshot.
      description: >
        No query parameters are accepted, including an empty query. Levels are
        returned in stable identifier order, not rank order, including retired
        entries for historical Task references. This read does not change the
        Project, Task, Event, queue, or Run state. The owner browser gateway caps
        the complete response at 64 KiB and fails explicitly if it is larger;
        it never truncates the catalog.
      responses:
        '200':
          description: Complete Project priority scheme and its snapshot revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPrioritySchemeView'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/projects/{projectId}/employees:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/PageCursor'
      - $ref: '#/components/parameters/PageLimit'
    get:
      tags: [projects]
      operationId: listEmployees
      summary: List safe Employee summaries for one Project.
      description: Stable name then ID order. State is scheduling eligibility, not live availability.
      responses:
        '200':
          description: A bounded page of Employee summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/projects/{projectId}/employees/{employeeId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/EmployeeId'
    get:
      tags: [projects]
      operationId: getEmployee
      summary: Read one safe Employee profile in its Project.
      description: State controls eligibility for new assignments, not live availability.
      responses:
        '200':
          description: Canonical Employee profile without provider credentials or runtime session data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfileView'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/projects/{projectId}/employees/{employeeId}/runs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/EmployeeId'
      - $ref: '#/components/parameters/PageCursor'
      - $ref: '#/components/parameters/PageLimit'
    get:
      tags: [runs]
      operationId: listEmployeeRuns
      summary: List retained Runs owned by one Employee, newest first.
      description: Ordered by creation time and ID descending. Hook and SystemJob Runs have no Employee owner.
      responses:
        '200':
          description: Bounded page of existing safe Run projections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeRunListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/projects/{projectId}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/PageCursor'
      - $ref: '#/components/parameters/PageLimit'
    get:
      tags: [tasks]
      operationId: listTasks
      summary: List Task projections in a Project.
      responses:
        '200':
          description: A stable page of current Task projections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/projects/{projectId}/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: getTask
      summary: Read one Task with its canonical Artifacts and wait conditions.
      responses:
        '200':
          description: Current Task detail projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetailView'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/projects/{projectId}/tasks/{taskId}/dependencies/{direction}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/PageCursor'
      - name: direction
        in: path
        required: true
        schema:
          type: string
          enum: [blocked_by, blocks]
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    get:
      tags: [tasks]
      operationId: listTaskDependencies
      summary: Read dependencies and related Tasks in either direction.
      description: >-
        Read-only coherent snapshot, sorted by related Task ID. Cursor is scoped to
        Project, Task and direction; removed or wrong-scope cursor returns cursor_invalid.
        Condition state is not Task readiness. Cancelled blockers do not satisfy task_done.
      responses:
        '200':
          description: Bounded dependency page. Final page omits next_cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDependencyListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CursorInvalid'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/projects/{projectId}/tasks/{taskId}/git-source-policy:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: getTaskGitSourcePolicy
      summary: Read the source policy for future writer Runs of a Git-bound Task.
      responses:
        '200':
          description: Current immutable source-policy revision; default is revision one.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskGitSourceSetting'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/projects/{projectId}/tasks/{taskId}/file-snapshots:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/PageCursor'
      - $ref: '#/components/parameters/PageLimit'
    get:
      tags: [tasks]
      operationId: listTaskFileSnapshots
      summary: Read capture operations and immutable manifests without host paths.
      responses:
        '200':
          description: Capture status is separate from Task lifecycle. Only sealed operations have an Artifact.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/FileSnapshotView'}}
                  next_cursor: {type: [string, 'null']}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/projects/{projectId}/tasks/{taskId}/file-inputs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: listTaskFileInputs
      summary: Read immutable snapshots attached to future Runs of this Task.
      responses:
        '200':
          description: At most eight same-Project snapshots; existing RunSpecs never change.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/TaskFileInput'}}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/projects/{projectId}/pipelines:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/PageCursor'
      - $ref: '#/components/parameters/PageLimit'
    get:
      tags: [pipelines]
      operationId: listPipelineVersions
      summary: List immutable PipelineVersion projections in a Project.
      responses:
        '200':
          description: A stable page of PipelineVersion projections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/projects/{projectId}/pipelines/{pipelineVersionId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/PipelineVersionId'
    get:
      tags: [pipelines]
      operationId: getPipelineVersion
      summary: Read a pinned immutable PipelineVersion.
      responses:
        '200':
          description: Pipeline graph and stage contract projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineVersionView'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/projects/{projectId}/runs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/PageCursor'
      - $ref: '#/components/parameters/PageLimit'
    get:
      tags: [runs]
      operationId: listRuns
      summary: List observed and desired Run state without raw runtime logs.
      responses:
        '200':
          description: A stable page of Run projections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/projects/{projectId}/runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [runs]
      operationId: getRun
      summary: Read one Run's desired and observed state.
      responses:
        '200':
          description: Current Run projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunView'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/projects/{projectId}/employees/{employeeId}/threads:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: employeeId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UuidV7'
      - name: after
        in: query
        description: Exclusive thread UUID from next_cursor; creation order is stable.
        schema:
          $ref: '#/components/schemas/UuidV7'
      - $ref: '#/components/parameters/PageLimit'
    get:
      tags: [inbox]
      operationId: listEmployeeThreads
      summary: Read a bounded page of an Employee's conversations.
      responses:
        '200':
          description: Canonical threads, including taskless conversations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeThreadList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/projects/{projectId}/threads/{threadId}/messages:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: threadId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UuidV7'
      - name: after
        in: query
        description: Exclusive per-thread sequence, zero by default.
        schema:
          type: integer
          minimum: 0
          maximum: 9223372036854775807
      - $ref: '#/components/parameters/PageLimit'
    get:
      tags: [inbox]
      operationId: listEmployeeMessages
      summary: Read immutable messages in thread sequence order.
      responses:
        '200':
          description: Canonical messages; reading does not acknowledge them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeMessageList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/projects/{projectId}/events:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/EventAfter'
      - $ref: '#/components/parameters/LastEventId'
    get:
      tags: [events]
      operationId: streamProjectEvents
      summary: Replay and follow canonical Project Events with SSE.
      description: |
        The SSE `id` is the canonical monotonically increasing
        `project_sequence`. `Last-Event-ID` takes precedence over `after`.
        Core emits a bounded retained replay with a sequence greater than the
        resolved cursor. Clients must de-duplicate by `id` because reconnect is
        at-least-once; the server closes the finite M0 stream, then clients
        reconnect with the last successfully processed `id` and re-read
        authoritative state as needed. `audit_reason` is a distinct nullable
        field, never a convention inside `payload`.
      responses:
        '200':
          description: An SSE stream of EventEnvelope JSON documents.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                taskCreated:
                  summary: One SSE record
                  value: |
                    id: 42
                    event: forge.event
                    data: {"schema_version":1,"event_id":"019...","project_id":"019...","project_sequence":42,"event_type":"task_created","aggregate":{"kind":"task","id":"019...","revision":1},"occurred_at":"2026-09-04T12:00:00Z","actor":{"kind":"human","id":"019..."},"command_id":"019...","audit_reason":null,"payload":{"task_key":"TASK-001"}}
              x-forge-sse-event:
                name: forge.event
                id: project_sequence
                data_schema:
                  $ref: '#/components/schemas/EventEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CursorInvalid'

components:
  parameters:
    CommandName:
      name: name
      in: path
      required: true
      description: The M0 command selected by this request path.
      schema:
        $ref: '#/components/schemas/CommandName'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Caller-generated stable key for one logical command. Reusing it with an
        identical request returns the original receipt; changing the command or
        payload returns `idempotency_conflict`.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    PipelineVersionId:
      name: pipelineVersionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    RunId:
      name: runId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    PageCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the previous list response.
      schema:
        type: string
        minLength: 1
    PageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    EventAfter:
      name: after
      in: query
      required: false
      description: Replay events strictly after this canonical Project sequence.
      schema:
        type: integer
        minimum: 0
        format: int64
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: SSE reconnect cursor. Takes precedence over `after`.
      schema:
        type: integer
        minimum: 0
        format: int64

  headers:
    RequestId:
      description: Server-generated correlation id for local diagnostics.
      schema:
        $ref: '#/components/schemas/UuidV7'

  responses:
    InvalidRequest:
      description: The request cannot be parsed or violates a transport contract.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The server-derived actor lacks the required capability.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested resource does not exist in the Project scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Current state, revision, or idempotency use conflicts with the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: The command is structurally valid but violates domain preconditions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CursorInvalid:
      description: The requested SSE cursor cannot be replayed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: A required local Forge dependency is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    UuidV7:
      type: string
      format: uuid
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
      description: A UUIDv7 identifier generated by Forge unless stated otherwise.

    Rfc3339Timestamp:
      type: string
      format: date-time
      description: UTC timestamp serialized in RFC 3339 format.

    JsonObject:
      type: object
      additionalProperties: true
      description: A JSON object interpreted only by the selected domain contract.

    ArtifactMetadata:
      type: object
      additionalProperties: true
      maxProperties: 64
      description: >
        Non-authoritative structured Artifact context. Across the complete
        object tree, Core permits at most 64 object members or array elements,
        a maximum object/array depth of 8 counting this root object as depth
        one, and at most 16384 serialized UTF-8 bytes. Metadata is not a bulk
        evidence channel; put substantive evidence in `body`.
      x-forge-max-total-entries: 64
      x-forge-max-container-depth: 8
      x-forge-max-serialized-utf8-bytes: 16384

    TaskProperties:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/TaskPropertyValue'
      description: >
        Project-keyed Task values. Every value uses Forge's tagged
        `{ "type": ..., "value": ... }` representation; arbitrary JSON
        values are not accepted.

    TaskPropertyValue:
      oneOf:
        - $ref: '#/components/schemas/BooleanPropertyValue'
        - $ref: '#/components/schemas/TextPropertyValue'
        - $ref: '#/components/schemas/NumberPropertyValue'
        - $ref: '#/components/schemas/DatePropertyValue'
        - $ref: '#/components/schemas/EnumPropertyValue'
        - $ref: '#/components/schemas/MultiEnumPropertyValue'
        - $ref: '#/components/schemas/ReferencePropertyValue'
      discriminator:
        propertyName: type
        mapping:
          boolean: '#/components/schemas/BooleanPropertyValue'
          text: '#/components/schemas/TextPropertyValue'
          number: '#/components/schemas/NumberPropertyValue'
          date: '#/components/schemas/DatePropertyValue'
          enum: '#/components/schemas/EnumPropertyValue'
          multi_enum: '#/components/schemas/MultiEnumPropertyValue'
          reference: '#/components/schemas/ReferencePropertyValue'

    BooleanPropertyValue:
      type: object
      required: [type, value]
      properties:
        type:
          const: boolean
        value:
          type: boolean

    TextPropertyValue:
      type: object
      required: [type, value]
      properties:
        type:
          const: text
        value:
          type: string

    NumberPropertyValue:
      type: object
      required: [type, value]
      properties:
        type:
          const: number
        value:
          type: number

    DatePropertyValue:
      type: object
      required: [type, value]
      properties:
        type:
          const: date
        value:
          type: array
          minItems: 2
          maxItems: 2
          prefixItems:
            - type: integer
              description: Proleptic Gregorian calendar year.
            - type: integer
              minimum: 1
              maximum: 366
              description: One-based day of year.
          items: false
          description: >
            Current tagged `time::Date` JSON representation: `[year,
            ordinal_day]`, for example `[2026, 247]`. This is deliberately not
            an ISO-8601 string so it round-trips through the existing domain
            representation unchanged.

    PropertyChoice:
      type: string
      minLength: 1
      maxLength: 128
      description: A non-blank Project-defined property choice.

    EnumPropertyValue:
      type: object
      required: [type, value]
      properties:
        type:
          const: enum
        value:
          $ref: '#/components/schemas/PropertyChoice'

    MultiEnumPropertyValue:
      type: object
      required: [type, value]
      properties:
        type:
          const: multi_enum
        value:
          type: array
          items:
            $ref: '#/components/schemas/PropertyChoice'

    ForgeReference:
      type: object
      required: [reference_type, reference_id]
      properties:
        reference_type:
          type: string
          enum: [project, task, artifact, employee]
        reference_id:
          $ref: '#/components/schemas/UuidV7'

    ReferencePropertyValue:
      type: object
      required: [type, value]
      properties:
        type:
          const: reference
        value:
          $ref: '#/components/schemas/ForgeReference'

    StableKey:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z][a-z0-9_]{0,63}$'
      description: >
        A durable Project-defined key: lowercase ASCII, beginning with a letter,
        then lowercase ASCII letters, digits, or underscores. Display names are
        separate fields and must not be used where this schema is required.

    TaskTitle:
      type: string
      minLength: 1
      maxLength: 240
      description: A non-blank human-readable Task title.

    ArtifactTitle:
      type: string
      minLength: 1
      maxLength: 240
      description: A non-blank human-readable Artifact title.

    DefinitionOfDone:
      type: string
      minLength: 1
      maxLength: 20000
      description: >
        Explicit success criteria. It may be absent while a Task is a draft but
        is required before `approve_task` can succeed.

    CommandAuditDetail:
      type: string
      maxLength: 10000
      description: >
        Optional operator-supplied audit detail. Core measures Unicode
        scalar-value characters and rejects a longer value at command parsing.

    TaskRevision:
      type: integer
      minimum: 1
      format: int64
      description: A Task aggregate revision; Task revisions begin at one.

    TaskKind:
      type: string
      enum: [delivery, analysis]

    ExecutorKind:
      type: string
      enum: [employee, system, human, external]
      description: >
        `human` and `external` stages enter a typed Task wait until their
        Pipeline-defined outcome is submitted through Core.

    InlineArtifactBody:
      description: >
        Inline M0 Artifact JSON. The UTF-8 encoded serialized JSON document,
        including JSON syntax, must not exceed 262144 bytes (256 KiB). The
        boundary is measured by Core after serialization, not by JSON character
        count. Larger or binary evidence requires an object reference after M0.
      x-forge-max-utf8-bytes: 262144

    CommandName:
      type: string
      enum:
        - report_finding
        - triage_finding
        - promote_finding
        - create_project
        - create_pipeline
        - publish_pipeline_version
        - set_pipeline_default_version
        - delete_pipeline
        - create_employee
        - amend_employee
        - enable_employee
        - disable_employee
        - retire_employee
        - stop_employee
        - open_employee_thread
        - send_employee_message
        - waive_message_requirement
        - create_task
        - register_project_repository
        - bind_task_git_repository
        - set_task_git_source_policy
        - import_task_file_snapshot
        - capture_task_file_snapshot
        - attach_task_file_input
        - amend_draft
        - approve_task
        - cancel_task
        - resume_task
        - pause_task
        - set_next_run_employee
        - clear_next_run_employee
        - schedule_task_resume
        - configure_resolver_route
        - raise_escalation
        - submit_human_resolution
        - reroute_escalation
        - cancel_task_resume
        - set_task_priority
        - create_dependency
        - remove_dependency
        - start_project_execution
        - stop_project_execution
        - submit_external_stage_outcome
        - configure_employee_runtime
        - configure_project_hook
        - enroll_credential
        - configure_boot_recovery_policy
        - accept_run_recovery_assessment
        - retry_communication
        - retry_git_integration
        - accept_git_integration_result

    CommandRequest:
      type: object
      additionalProperties: false
      required: [project_id, expected_revision, payload]
      properties:
        project_id:
          $ref: '#/components/schemas/UuidV7'
        expected_revision:
          type: integer
          minimum: 0
          format: int64
          description: >
            Expected current Project revision at the command boundary. For
            `create_project`, this must be zero and `project_id` is the
            caller-reserved UUIDv7 for the new Project.
        payload:
          anyOf:
            - $ref: '#/components/schemas/ReportFindingPayload'
            - $ref: '#/components/schemas/TriageFindingPayload'
            - $ref: '#/components/schemas/PromoteFindingPayload'
            - $ref: '#/components/schemas/CreateProjectPayload'
            - $ref: '#/components/schemas/RegisterProjectRepositoryPayload'
            - $ref: '#/components/schemas/BindTaskGitRepositoryPayload'
            - $ref: '#/components/schemas/SetTaskGitSourcePolicyPayload'
            - $ref: '#/components/schemas/ImportTaskFileSnapshotPayload'
            - $ref: '#/components/schemas/CaptureTaskFileSnapshotPayload'
            - $ref: '#/components/schemas/AttachTaskFileInputPayload'
            - $ref: '#/components/schemas/CreatePipelinePayload'
            - $ref: '#/components/schemas/PublishPipelineVersionPayload'
            - $ref: '#/components/schemas/SetPipelineDefaultVersionPayload'
            - $ref: '#/components/schemas/DeletePipelinePayload'
            - $ref: '#/components/schemas/CreateEmployeePayload'
            - $ref: '#/components/schemas/AmendEmployeePayload'
            - $ref: '#/components/schemas/EmployeeLifecyclePayload'
            - $ref: '#/components/schemas/StopEmployeePayload'
            - $ref: '#/components/schemas/OpenEmployeeThreadPayload'
            - $ref: '#/components/schemas/SendEmployeeMessagePayload'
            - $ref: '#/components/schemas/WaiveMessageRequirementPayload'
            - $ref: '#/components/schemas/CreateTaskPayload'
            - $ref: '#/components/schemas/AmendDraftPayload'
            - $ref: '#/components/schemas/ApproveTaskPayload'
            - $ref: '#/components/schemas/CancelTaskPayload'
            - $ref: '#/components/schemas/ResumeTaskPayload'
            - $ref: '#/components/schemas/PauseTaskPayload'
            - $ref: '#/components/schemas/SetNextRunEmployeePayload'
            - $ref: '#/components/schemas/ClearNextRunEmployeePayload'
            - $ref: '#/components/schemas/ScheduleTaskResumePayload'
            - $ref: '#/components/schemas/ConfigureResolverRoutePayload'
            - $ref: '#/components/schemas/RaiseEscalationPayload'
            - $ref: '#/components/schemas/SubmitHumanResolutionPayload'
            - $ref: '#/components/schemas/RerouteEscalationPayload'
            - $ref: '#/components/schemas/CancelTaskResumePayload'
            - $ref: '#/components/schemas/SetTaskPriorityPayload'
            - $ref: '#/components/schemas/CreateDependencyPayload'
            - $ref: '#/components/schemas/RemoveDependencyPayload'
            - $ref: '#/components/schemas/StartProjectExecutionPayload'
            - $ref: '#/components/schemas/StopProjectExecutionPayload'
            - $ref: '#/components/schemas/SubmitExternalStageOutcomePayload'
            - $ref: '#/components/schemas/ConfigureEmployeeRuntimePayload'
            - $ref: '#/components/schemas/ConfigureProjectHookPayload'
            - $ref: '#/components/schemas/EnrollCredentialPayload'
            - $ref: '#/components/schemas/ConfigureBootRecoveryPolicyPayload'
            - $ref: '#/components/schemas/AcceptRunRecoveryAssessmentPayload'
            - $ref: '#/components/schemas/RetryCommunicationPayload'
            - $ref: '#/components/schemas/GitIntegrationResolutionPayload'
          description: |
            The schema must match the `{name}` path parameter. `anyOf` is used
            because empty start/stop payloads intentionally overlap; Core still
            enforces the path-to-payload pairing.

    GitCommitId:
      type: string
      pattern: '^(?!0+$)([a-fA-F0-9]{40}|[a-fA-F0-9]{64})$'

    GitInitialRevision:
      oneOf:
        - $ref: '#/components/schemas/GitCommitId'
        - type: object
          additionalProperties: false
          required: [kind, commit]
          properties:
            kind: {const: commit}
            commit: {$ref: '#/components/schemas/GitCommitId'}
        - type: object
          additionalProperties: false
          required: [kind, object_format]
          properties:
            kind: {const: unborn}
            object_format: {type: string, enum: [sha1, sha256]}
      description: No null or all-zero commit. Explicit committed input serializes in the legacy SHA-string form.

    TaskGitSourcePolicy:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode: {const: latest_target}
        - type: object
          additionalProperties: false
          required: [mode, commit]
          properties:
            mode: {const: pinned_commit}
            commit: {$ref: '#/components/schemas/GitCommitId'}

    TaskGitSourceSetting:
      type: object
      additionalProperties: false
      required: [revision, policy]
      properties:
        revision: {type: integer, minimum: 1}
        policy: {$ref: '#/components/schemas/TaskGitSourcePolicy'}

    RegisterProjectRepositoryPayload:
      type: object
      additionalProperties: false
      required: [name, source, target_ref]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        source: {type: string, minLength: 2, maxLength: 4096, description: 'Operator-owned normalized absolute local path, never a remote URL or implicit Forge checkout.'}
        target_ref: {type: string, pattern: '^refs/heads/', maxLength: 1024}
      x-forge-command: register_project_repository

    BindTaskGitRepositoryPayload:
      type: object
      additionalProperties: false
      required: [task_id, expected_task_revision, repository_id, initial_base]
      properties:
        task_id: {$ref: '#/components/schemas/UuidV7'}
        expected_task_revision: {$ref: '#/components/schemas/TaskRevision'}
        repository_id: {$ref: '#/components/schemas/UuidV7'}
        initial_base: {$ref: '#/components/schemas/GitInitialRevision'}
      x-forge-command: bind_task_git_repository

    SetTaskGitSourcePolicyPayload:
      type: object
      additionalProperties: false
      required: [task_id, expected_policy_revision, policy, reason]
      properties:
        task_id: {$ref: '#/components/schemas/UuidV7'}
        expected_policy_revision: {type: integer, minimum: 1}
        policy: {$ref: '#/components/schemas/TaskGitSourcePolicy'}
        reason: {type: string, minLength: 1, maxLength: 4096}
      description: Human or System Manager only. Appends source-policy history for future writer Runs without changing Task revision, current proposals, existing RunSpecs or retained files.
      x-forge-command: set_task_git_source_policy

    SelectedFilePaths:
      type: array
      minItems: 1
      maxItems: 64
      uniqueItems: true
      items: {type: string, minLength: 1, maxLength: 1024}
      description: Explicit normalized relative regular files. No glob, directory recursion, traversal, credential/service paths, symlinks or hardlinks. Total bytes at most 16 MiB.

    ImportTaskFileSnapshotPayload:
      type: object
      additionalProperties: false
      required: [task_id, expected_task_revision, title, root, paths]
      properties:
        task_id: {$ref: '#/components/schemas/UuidV7'}
        expected_task_revision: {$ref: '#/components/schemas/TaskRevision'}
        title: {type: string, minLength: 1, maxLength: 240}
        root: {type: string, minLength: 2, maxLength: 4096}
        paths: {$ref: '#/components/schemas/SelectedFilePaths'}
      description: Human/Manager imports explicit files from an operator-owned canonical local directory. Configured runtime and SecretStore directories are excluded. Commits pending intent before I/O; terminal Tasks reject new evidence.
      x-forge-command: import_task_file_snapshot

    CaptureTaskFileSnapshotPayload:
      type: object
      additionalProperties: false
      required: [task_id, expected_task_revision, title, paths]
      properties:
        task_id: {$ref: '#/components/schemas/UuidV7'}
        expected_task_revision: {$ref: '#/components/schemas/TaskRevision'}
        title: {type: string, minLength: 1, maxLength: 240}
        paths: {$ref: '#/components/schemas/SelectedFilePaths'}
      description: Human/Manager captures a nonterminal Task's retained writer surface after explicit stop and physical quiescence. Does not stop implicitly. Pending capture blocks new writers and Integration until sealed or completed failure.
      x-forge-command: capture_task_file_snapshot

    AttachTaskFileInputPayload:
      type: object
      additionalProperties: false
      required: [task_id, expected_task_revision, artifact_id]
      properties:
        task_id: {$ref: '#/components/schemas/UuidV7'}
        expected_task_revision: {$ref: '#/components/schemas/TaskRevision'}
        artifact_id: {$ref: '#/components/schemas/UuidV7'}
      description: Human/Manager attaches a sealed file snapshot from another Task in the same Project as a future Run input. No Task revision/lifecycle change, GitCandidate, overlay or automatic copy; terminal Tasks reject attachment.
      x-forge-command: attach_task_file_input

    SnapshotFile:
      type: object
      additionalProperties: false
      required: [path, size_bytes, executable, sha256, object_key]
      properties:
        path: {type: string, minLength: 1, maxLength: 1024}
        size_bytes: {type: integer, minimum: 0, maximum: 16777216}
        executable: {type: boolean}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        object_key: {type: string, description: Immutable file-snapshots/Project/Artifact/digest object key, not a host path.}

    FileSnapshotManifest:
      type: object
      additionalProperties: false
      required: [schema_version, project_id, source_task_id, files]
      properties:
        schema_version: {type: integer, const: 1}
        project_id: {$ref: '#/components/schemas/UuidV7'}
        source_task_id: {$ref: '#/components/schemas/UuidV7'}
        files: {type: array, minItems: 1, maxItems: 64, items: {$ref: '#/components/schemas/SnapshotFile'}}

    TaskFileInput:
      type: object
      additionalProperties: false
      required: [artifact_id, manifest]
      properties:
        artifact_id: {$ref: '#/components/schemas/UuidV7'}
        manifest: {$ref: '#/components/schemas/FileSnapshotManifest'}

    FileSnapshotView:
      type: object
      additionalProperties: false
      required: [id, artifact_id, task_id, title, state, error_code, manifest, created_at]
      properties:
        id: {$ref: '#/components/schemas/UuidV7'}
        artifact_id: {$ref: '#/components/schemas/UuidV7'}
        task_id: {$ref: '#/components/schemas/UuidV7'}
        title: {type: string}
        state: {type: string, enum: [pending, sealed, failed]}
        error_code: {type: [string, 'null']}
        manifest:
          oneOf:
            - $ref: '#/components/schemas/FileSnapshotManifest'
            - {type: 'null'}
        created_at: {type: string, format: date-time}

    ConfigureProjectHookPayload:
      type: object
      additionalProperties: false
      required: [name, image, command, workdir, limits, max_output_bytes, required]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        image: {type: string, description: Pinned OCI digest with the Forge runner wrapper installed.}
        command:
          type: array
          minItems: 1
          maxItems: 128
          items: {type: string, maxLength: 32768}
          description: Container executable followed by arguments; no implicit host shell or test discovery.
        workdir: {type: string, minLength: 1, maxLength: 4096, description: 'Relative candidate directory, or a dot for its root; no parent traversal.'}
        limits: {$ref: '#/components/schemas/RuntimeBinding/properties/limits'}
        max_output_bytes: {type: integer, minimum: 1, maximum: 268435456}
        applicable_task_kinds:
          type: array
          uniqueItems: true
          default: []
          items: {type: string, enum: [delivery, analysis]}
          description: Empty means all kinds. A nonmatch records explicit Skipped without a Run.
        required: {type: boolean, description: Owner opt-in to an exact-candidate prerequisite before Done and Git integration.}
      x-forge-command: configure_project_hook
      description: Creates a new immutable UUID version in the envelope Project. Core supplies identity/time; same-key retry returns the original version. No credentials or provider fields are accepted.

    ProjectHookVersionView:
      type: object
      additionalProperties: false
      required: [id, project_id, name, image, command, workdir, limits, max_output_bytes, applicable_task_kinds, required, created_at]
      properties:
        id: {$ref: '#/components/schemas/UuidV7'}
        project_id: {$ref: '#/components/schemas/UuidV7'}
        name: {$ref: '#/components/schemas/ConfigureProjectHookPayload/properties/name'}
        image: {$ref: '#/components/schemas/ConfigureProjectHookPayload/properties/image'}
        command: {$ref: '#/components/schemas/ConfigureProjectHookPayload/properties/command'}
        workdir: {$ref: '#/components/schemas/ConfigureProjectHookPayload/properties/workdir'}
        limits: {$ref: '#/components/schemas/RuntimeBinding/properties/limits'}
        max_output_bytes: {$ref: '#/components/schemas/ConfigureProjectHookPayload/properties/max_output_bytes'}
        applicable_task_kinds: {$ref: '#/components/schemas/ConfigureProjectHookPayload/properties/applicable_task_kinds'}
        required: {type: boolean}
        created_at: {type: string, format: date-time}

    ConfigureEmployeeRuntimePayload:
      type: object
      additionalProperties: false
      required: [employee_id, binding]
      properties:
        employee_id:
          $ref: '#/components/schemas/UuidV7'
        binding:
          $ref: '#/components/schemas/RuntimeBinding'
      x-forge-command: configure_employee_runtime

    EnrollCredentialPayload:
      type: object
      additionalProperties: false
      required: [secret_id, binding_id, kind, source_file]
      properties:
        secret_id:
          $ref: '#/components/schemas/UuidV7'
        binding_id:
          $ref: '#/components/schemas/UuidV7'
        kind:
          type: string
          enum: [codex_chatgpt, api_key, claude_subscription]
        source_file:
          type: string
          pattern: '^/'
          maxLength: 4096
          description: Explicit owner-only local file; never credential bytes.
      x-forge-command: enroll_credential

    ConfigureBootRecoveryPolicyPayload:
      type: object
      additionalProperties: false
      required: [policy]
      properties:
        policy:
          type: string
          enum: [reconcile_then_resume_queue, recover_safe_then_hold, manual_hold]
      x-forge-command: configure_boot_recovery_policy

    GitIntegrationView:
      type: object
      additionalProperties: false
      required: [id, task_id, fence, stage_id, stage_visit, candidate_proposal_id, candidate, state, expected_task_revision, wait_condition_id, resolution, prepared_merge, result_code, created_at]
      properties:
        id: {$ref: '#/components/schemas/UuidV7'}
        task_id: {$ref: '#/components/schemas/UuidV7'}
        candidate_proposal_id: {$ref: '#/components/schemas/UuidV7'}
        fence: {type: integer, minimum: 1}
        stage_id: {$ref: '#/components/schemas/StableKey'}
        stage_visit: {type: integer, minimum: 1}
        expected_task_revision: {type: integer, minimum: 1}
        candidate:
          type: object
          required: [commit, tree]
          properties:
            commit: {type: string}
            tree: {type: string}
        state: {type: string, enum: [preparing, prepared, applying, held, completed, retired]}
        wait_condition_id: {type: [string, 'null'], format: uuid}
        resolution: {type: [string, 'null'], enum: [retry, accept, null]}
        prepared_merge:
          oneOf:
            - type: 'null'
            - type: object
              required: [expected_target, merge_commit]
              properties:
                expected_target: {type: [string, 'null'], description: 'Explicit null means create-only initial publication; it is not an unknown target.'}
                merge_commit: {type: string}
        result_code:
          type: [string, 'null']
          enum: [prepared, applied, no_changes, stale_base, retryable, no_preparation, unknown, busy, refused, unavailable, null]
        created_at: {$ref: '#/components/schemas/Rfc3339Timestamp'}

    GitIntegrationResolutionPayload:
      type: object
      additionalProperties: false
      required: [operation_id, expected_task_revision, reason]
      properties:
        operation_id:
          $ref: '#/components/schemas/UuidV7'
        expected_task_revision:
          type: integer
          minimum: 1
          format: int64
        reason:
          type: string
          minLength: 1
          maxLength: 4096
      description: >
        Retry requires fresh read-only reconciliation before reusing the exact retained
        merge intent. Accept requires a recorded Applied result and fresh observation,
        applies only the configured Task outcome, and never repeats CAS. Both require
        the resumed current Task visit and current candidate/review/Project gates.
      x-forge-commands: [retry_git_integration, accept_git_integration_result]

    RetryCommunicationPayload:
      type: object
      additionalProperties: false
      required: [run_id, reason]
      properties:
        run_id:
          $ref: '#/components/schemas/UuidV7'
        reason:
          type: string
          minLength: 1
          maxLength: 4096
