              required: [run_id, fencing_token, environment_epoch]
              properties:
                run_id: {$ref: '#/components/schemas/UuidV7'}
                fencing_token: {type: integer, minimum: 1}
                environment_epoch: {type: integer, minimum: 1}
        description: {type: string}
        severity: {type: string}
        evidence: {type: array, items: {$ref: '#/components/schemas/UuidV7'}}
        reported_by: {$ref: '#/components/schemas/ActorReference'}
        reported_at: {type: string, format: date-time}
        revision: {type: integer, minimum: 1}
        state:
          type: object
          required: [status]
          properties:
            status: {type: string, enum: [open, attached, promoted, ignored]}
            task_id: {$ref: '#/components/schemas/UuidV7'}
            reason: {type: string}
            by: {$ref: '#/components/schemas/ActorReference'}
            at: {type: string, format: date-time}

    CandidateReviewRecord:
      type: object
      required: [id, project_id, task_id, pipeline_version_id, stage_id, stage_visit, employee_id, scope, candidate_proposal_id, candidate, subject_artifact_ids, verdict_artifact_ids, outcome, verdict, recorded_at]
      properties:
        id: {$ref: '#/components/schemas/UuidV7'}
        project_id: {$ref: '#/components/schemas/UuidV7'}
        task_id: {$ref: '#/components/schemas/UuidV7'}
        pipeline_version_id: {$ref: '#/components/schemas/UuidV7'}
        stage_id: {$ref: '#/components/schemas/StableKey'}
        stage_visit: {type: integer, minimum: 1}
        employee_id: {$ref: '#/components/schemas/UuidV7'}
        scope:
          type: object
          required: [run_id, fencing_token, environment_epoch]
          properties:
            run_id: {$ref: '#/components/schemas/UuidV7'}
            fencing_token: {type: integer, minimum: 1}
            environment_epoch: {type: integer, minimum: 1}
        candidate_proposal_id: {$ref: '#/components/schemas/UuidV7'}
        candidate:
          type: object
          required: [commit, tree]
          properties:
            commit: {type: string, pattern: '^([0-9a-f]{40}|[0-9a-f]{64})$'}
            tree: {type: string, pattern: '^([0-9a-f]{40}|[0-9a-f]{64})$'}
        subject_artifact_ids: {type: array, maxItems: 64, uniqueItems: true, items: {$ref: '#/components/schemas/UuidV7'}}
        verdict_artifact_ids: {type: array, maxItems: 64, uniqueItems: true, items: {$ref: '#/components/schemas/UuidV7'}}
        outcome: {$ref: '#/components/schemas/StableKey'}
        verdict: {type: string, enum: [accepted, rejected, inconclusive]}
        recorded_at: {type: string, format: date-time}

    PipelineTransitionView:
      type: object
      additionalProperties: false
      required: [from_stage_id, outcome, target]
      properties:
        from_stage_id:
          $ref: '#/components/schemas/StableKey'
        outcome:
          $ref: '#/components/schemas/StableKey'
        target:
          $ref: '#/components/schemas/PipelineTransitionTarget'
        artifact_requirements:
          type: array
          default: []
          maxItems: 32
          description: >
            Mechanically required Artifact kinds for this outcome. An omitted
            value is an empty requirement set. Core checks only an explicitly
            cited Artifact's kind, scope, and count; it never verifies an
            Artifact body's semantic truth.
          items:
            $ref: '#/components/schemas/PipelineArtifactRequirement'

    PipelineArtifactRequirement:
      type: object
      additionalProperties: false
      required: [kind, minimum_count]
      properties:
        kind:
          $ref: '#/components/schemas/StableKey'
        minimum_count:
          type: integer
          minimum: 1
          maximum: 65535
          format: int32
        scope:
          type: string
          enum: [current_stage, task_history]
          default: current_stage
          description: >
            `current_stage` counts only explicitly cited Artifacts attached
            during the exact current stage visit. Returning to the same stage
            creates a new visit, so evidence from an earlier visit does not
            qualify. `task_history` deliberately permits explicitly cited
            Artifacts already linked to this Task, regardless of stage visit.

    PipelineTransitionTarget:
      oneOf:
        - $ref: '#/components/schemas/NextStageTarget'
        - $ref: '#/components/schemas/DoneTarget'
        - $ref: '#/components/schemas/CancelledTarget'

    NextStageTarget:
      type: object
      additionalProperties: false
      required: [kind, stage_id]
      properties:
        kind:
          const: stage
        stage_id:
          $ref: '#/components/schemas/StableKey'

    DoneTarget:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          const: done

    CancelledTarget:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          const: cancelled

    StageEligibilityInput:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode:
              const: any
        - type: object
          additionalProperties: false
          required: [mode, stages]
          properties:
            mode:
              const: only
            stages:
              type: array
              minItems: 1
              maxItems: 128
              uniqueItems: true
              items:
                $ref: '#/components/schemas/StageEligibilityTarget'

    StageEligibilityTarget:
      type: object
      additionalProperties: false
      required: [pipeline_version_id, stage_id]
      description: >
        One immutable Pipeline-version-scoped selector. A bare stage key is
        not stable across versions, so Core matches both fields when deciding
        whether an Employee may be scheduled.
      properties:
        pipeline_version_id:
          $ref: '#/components/schemas/UuidV7'
        stage_id:
          $ref: '#/components/schemas/StableKey'

    PipelineListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PipelineVersionView'
        next_cursor:
          type: [string, 'null']

    RunView:
      type: object
      additionalProperties: false
      required:
        - id
        - task_id
        - employee_id
        - stage_id
        - attempt
        - desired_state
        - observed_state
        - lease_fencing_token
        - environment_epoch
        - last_observed_sequence
        - run_spec_version
        - assignment
      properties:
        diagnostics:
          type: object
          description: Present on single-Run GET only. Bounded evidence receipts, incidents, immutable handoff, provider-reported usage/exit and proxy usage; no prompts, tokens or raw exception bodies. Missing reports are null until collection completes. git_source retains the validated path-free immutable source selection for v6 Git writer Runs, or null when absent.
        id:
          $ref: '#/components/schemas/UuidV7'
        task_id:
          oneOf:
            - $ref: '#/components/schemas/UuidV7'
            - type: 'null'
          description: Present only for TaskStage ownership, never populated from Communication context.
        assignment:
          $ref: '#/components/schemas/ExecutionAssignment'
        employee_id:
          oneOf:
            - $ref: '#/components/schemas/UuidV7'
            - type: 'null'
          description: Null only for provider-free Hook execution; all agent assignments require an Employee.
        stage_id:
          oneOf:
            - $ref: '#/components/schemas/StableKey'
            - type: 'null'
        attempt:
          type: integer
          minimum: 1
        desired_state:
          type: string
          enum: [provision_requested, running, stop_requested, force_stop_requested, stopped, failed]
        observed_state:
          type: string
          enum: [unknown, provisioning, running, stopping, stopped, failed, lost]
        lease_fencing_token:
          type: integer
          minimum: 0
          format: int64
        environment_epoch:
          type: integer
          minimum: 0
          format: int64
        last_observed_sequence:
          type: integer
          minimum: 0
          format: int64
        run_spec_version:
          type: integer
          minimum: 1
          format: int32
          description: >
            Schema version of the opaque RunSpec supplied to Supervisor. M0
            uses version 1, Task sandbox Runs use version 2, Communication uses
            version 3, Resolution uses version 4, and provider-free Hook execution
            uses version 5; raw RunSpec contents are intentionally not exposed.
        created_at:
          $ref: '#/components/schemas/Rfc3339Timestamp'
        updated_at:
          $ref: '#/components/schemas/Rfc3339Timestamp'

    ExecutionAssignment:
      oneOf:
        - type: object
          additionalProperties: false
          required: [purpose, owner]
          properties:
            purpose:
              const: task_stage
            owner:
              type: object
              additionalProperties: false
              required: [task_id, queue_entry_id, stage_id]
              properties:
                task_id:
                  $ref: '#/components/schemas/UuidV7'
                queue_entry_id:
                  $ref: '#/components/schemas/UuidV7'
                stage_id:
                  $ref: '#/components/schemas/StableKey'
        - type: object
          additionalProperties: false
          required: [purpose, owner]
          properties:
            purpose:
              const: communication
            owner:
              type: object
              additionalProperties: false
              required: [assignment_id, thread_id, source_message_id]
              properties:
                assignment_id:
                  $ref: '#/components/schemas/UuidV7'
                thread_id:
                  $ref: '#/components/schemas/UuidV7'
                source_message_id:
                  $ref: '#/components/schemas/UuidV7'
        - type: object
          additionalProperties: false
          required: [purpose, owner]
          properties:
            purpose:
              const: resolution
            owner:
              type: object
              additionalProperties: false
              required: [assignment_id, escalation_id, lease_generation]
              properties:
                assignment_id:
                  $ref: '#/components/schemas/UuidV7'
                escalation_id:
                  $ref: '#/components/schemas/UuidV7'
                lease_generation:
                  type: integer
                  minimum: 1
                  format: int64
        - type: object
          additionalProperties: false
          required: [purpose, owner]
          properties:
            purpose:
              const: hook
            owner:
              type: object
              additionalProperties: false
              required: [invocation_id, task_id, pipeline_version_id, stage_id, stage_visit, candidate_proposal_id]
              properties:
                invocation_id:
                  $ref: '#/components/schemas/UuidV7'
                task_id:
                  $ref: '#/components/schemas/UuidV7'
                pipeline_version_id:
                  $ref: '#/components/schemas/UuidV7'
                stage_id:
                  $ref: '#/components/schemas/StableKey'
                stage_visit:
                  type: integer
                  minimum: 1
                  format: int64
                candidate_proposal_id:
                  $ref: '#/components/schemas/UuidV7'
      description: Canonical purpose-specific owner. Contextual Task references in Resolution or Hook do not grant a Task writer lease. Inapplicable hooks record a skip without creating a Run.

    RunListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RunView'
        next_cursor:
          type: [string, 'null']

    EventEnvelope:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - event_id
        - project_id
        - project_sequence
        - event_type
        - aggregate
        - occurred_at
        - actor
        - command_id
        - audit_reason
        - payload
      properties:
        schema_version:
          type: integer
          const: 1
        event_id:
          $ref: '#/components/schemas/UuidV7'
        project_id:
          $ref: '#/components/schemas/UuidV7'
        project_sequence:
          type: integer
          minimum: 1
          format: int64
        event_type:
          type: string
          description: Stable snake_case canonical Event kind, such as task_created.
        aggregate:
          $ref: '#/components/schemas/AggregateReference'
        occurred_at:
          $ref: '#/components/schemas/Rfc3339Timestamp'
        actor:
          $ref: '#/components/schemas/ActorReference'
        command_id:
          oneOf:
            - $ref: '#/components/schemas/UuidV7'
            - type: 'null'
          description: >
            Accepted command that committed the Event. Canonical Core Events
            provide a UUIDv7; null preserves a historical durable Event that
            predates command attribution.
        audit_reason:
          type: [string, 'null']
          description: >
            Optional human-readable audit reason from canonical Event history.
            It is distinct from the event-type-specific payload.
        payload:
          $ref: '#/components/schemas/JsonObject'

    AggregateReference:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind:
          type: string
        id:
          $ref: '#/components/schemas/UuidV7'
        revision:
          type: integer
          minimum: 0
          format: int64

    ActorReference:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [human, employee, system_manager, core, supervisor]
        id:
          $ref: '#/components/schemas/UuidV7'
