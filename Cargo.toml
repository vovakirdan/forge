[workspace]
members = [
    "crates/forge-provider-opencode",
    "crates/forge-provider-litellm",
    "crates/forge-provider-codex",
    "crates/forge-provider-common",
    "crates/forge-domain",
    "crates/forge-application",
    "crates/forge-storage",
    "crates/forge-protocol",
    "crates/forge-core",
    "crates/forge-supervisor",
    "crates/forge-cli",
    "crates/forge-testkit",
]
default-members = [
    "crates/forge-provider-opencode",
    "crates/forge-provider-litellm",
    "crates/forge-provider-codex",
    "crates/forge-provider-common",
    "crates/forge-domain",
    "crates/forge-application",
    "crates/forge-storage",
    "crates/forge-protocol",
    "crates/forge-core",
    "crates/forge-supervisor",
    "crates/forge-cli",
    "crates/forge-testkit",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.98"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
async-nats = "0.42"
axum = { version = "0.8", features = ["json", "macros"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio-rustls", "time", "uuid"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
