// Forge's local Core-to-Supervisor control protocol.
//
// The Supervisor is the client: it opens this bidirectional stream over an
// authenticated Unix domain socket. It reports observations and executor
// submissions; Core remains the only authority that changes canonical state.
syntax = "proto3";

package forge.supervisor.v1;

// A single, long-lived control stream for one Supervisor process.
service SupervisorControl {
  // Supervisor must send SupervisorHello before any run-scoped message. Core
  // sends a CoreAcknowledgement for every accepted, rejected, or stale inbound
  // message. Provision and stop requests flow in the opposite direction.
  rpc SupervisorSession(stream SupervisorToCore) returns (stream CoreToSupervisor);
}

// An envelope sent by a Supervisor to Core.
message SupervisorToCore {
  oneof message {
    SupervisorHello hello = 1;
    ObservedRunEvent observed_run_event = 2;
    ExecutorSubmission executor_submission = 3;
    SupervisorInventory inventory = 4;
    GitCandidateInspectionResult git_candidate_inspection = 5;
    GitIntegrationReply git_integration = 6;
    RuntimeInputReceipt runtime_input_receipt = 9;
  }
}

// An envelope sent by Core to a connected Supervisor.
message CoreToSupervisor {
  oneof message {
    ProvisionRun provision_run = 1;
    StopRun stop_run = 2;
    CoreAcknowledgement acknowledgement = 3;
    RequestInventory request_inventory = 4;
    InspectGitCandidate inspect_git_candidate = 5;
    GitIntegrationCommand git_integration = 6;
    DeliverRuntimeInput deliver_runtime_input = 9;
    CaptureFileSnapshot capture_file_snapshot = 10;
  }
}

// Versioned typed domain JSON; strict bounded decoding is required on both peers.
// No Run is invented for a deterministic System stage. Paths derive only from
// the immutable operator-registered Task binding, never an Employee request.
message GitIntegrationCommand { string command_id = 1; string request_json = 2; }
message GitIntegrationReply { string message_id = 1; string result_json = 2; }

// Idempotent stopped-surface capture. Its byte-exact sealed result is retained
// under the shared private execution root, like grants and runtime evidence.
// Core keeps the maintenance reservation until it consumes that result.
message CaptureFileSnapshot { string request_json = 1; }

// Durable exact-scope control, never a shell command or a provider-specific flag.
message DeliverRuntimeInput {
  string command_id = 1;
  string run_id = 2;
  uint64 lease_fencing_token = 3;
  uint64 environment_epoch = 4;
  uint64 sequence = 5;
  oneof action {
    RuntimeMessageInput message = 6;
    CloseRuntimeInput close_after_turn = 7;
  }
}

message RuntimeMessageInput {
  // Canonical immutable EmployeeMessage. Body remains bounded to 32 KiB.
  string source_message_json = 1;
}

message CloseRuntimeInput {
  // Stable Core classification, not a model prompt or an emergency stop.
  string reason_code = 1;
}

// Runtime acceptance requires native echoed-input identity/session correlation.
// Neither durable queueing nor a successful stdin write establishes acceptance.
message RuntimeInputReceipt {
  string message_id = 1;
  string input_command_id = 2;
  string run_id = 3;
  uint64 lease_fencing_token = 4;
  uint64 environment_epoch = 5;
  RuntimeInputStatus status = 6;
}

enum RuntimeInputStatus {
  RUNTIME_INPUT_STATUS_UNSPECIFIED = 0;
  RUNTIME_INPUT_STATUS_RUNTIME_ACCEPTED = 1;
  RUNTIME_INPUT_STATUS_INPUT_CLOSED = 2;
  RUNTIME_INPUT_STATUS_UNSUPPORTED = 3;
  RUNTIME_INPUT_STATUS_STALE_SCOPE = 4;
  RUNTIME_INPUT_STATUS_CONFLICT = 5;
  RUNTIME_INPUT_STATUS_DELIVERY_UNKNOWN = 6;
}

// Read-only inspection of a previously provisioned Task writer after physical quiescence.
// No filesystem path or executable is accepted. This is not another Run stream event.
message InspectGitCandidate {
  string command_id = 1;
  string run_id = 2;
  uint64 lease_fencing_token = 3;
  uint64 environment_epoch = 4;
  string project_id = 5;
  string surface_id = 6;
  string expected_commit = 7;
  string host_id = 8;
  string boot_id = 9;
}

// Independently durable/replayable reply: it does not advance a stopped Run's sequence.
message GitCandidateInspectionResult {
  string message_id = 1;
  string request_command_id = 2;
  string run_id = 3;
  uint64 lease_fencing_token = 4;
  uint64 environment_epoch = 5;
  // Both identities are present only for VERIFIED; no raw Git diagnostic is transported.
  string commit = 6;
  string tree = 7;
  GitCandidateInspectionCode result_code = 8;
  string host_id = 9;
  string boot_id = 10;
}

enum GitCandidateInspectionCode {
  GIT_CANDIDATE_INSPECTION_CODE_UNSPECIFIED = 0;
  GIT_CANDIDATE_INSPECTION_CODE_VERIFIED = 1;
  GIT_CANDIDATE_INSPECTION_CODE_INVALID_REQUEST = 2;
  GIT_CANDIDATE_INSPECTION_CODE_STALE_SCOPE = 3;
  GIT_CANDIDATE_INSPECTION_CODE_BUSY = 4;
  GIT_CANDIDATE_INSPECTION_CODE_QUIESCENCE_UNKNOWN = 5;
  GIT_CANDIDATE_INSPECTION_CODE_UNSAFE_SURFACE = 6;
  GIT_CANDIDATE_INSPECTION_CODE_HEAD_CHANGED = 7;
  GIT_CANDIDATE_INSPECTION_CODE_DIRTY_CANDIDATE = 8;
  GIT_CANDIDATE_INSPECTION_CODE_UNSUPPORTED_REPOSITORY = 9;
  GIT_CANDIDATE_INSPECTION_CODE_UNAVAILABLE = 10;
  GIT_CANDIDATE_INSPECTION_CODE_CONFLICTING_REQUEST = 11;
}

// Requests a snapshot of execution identities retained by Supervisor. Inventory
// is observational evidence; it never authorizes a new provision or write lease.
message RequestInventory {
  string command_id = 1;
}

// Complete unresolved local inventory at capture time. Completed tombstones may
// be omitted only after an Accepted Stopped ACK and an empty replay queue.
// Unknown identities recovered from the durable journal must remain included.
message SupervisorInventory {
  string message_id = 1;
  string request_command_id = 2;
  string host_id = 3;
  string boot_id = 4;
  repeated RunInventoryEntry entries = 5;
}

message RunInventoryEntry {
  string run_id = 1;
  uint64 lease_fencing_token = 2;
  uint64 environment_epoch = 3;
  uint64 last_sequence = 4;
  EnvironmentPresence presence = 5;
  // Empty when no external execution environment has been identified.
  string environment_id = 6;
  // Boot during which this identity was originally admitted.
  string provision_boot_id = 7;
}

enum EnvironmentPresence {
  ENVIRONMENT_PRESENCE_UNSPECIFIED = 0;
  ENVIRONMENT_PRESENCE_ACTIVE = 1;
  ENVIRONMENT_PRESENCE_QUIESCENT = 2;
  ENVIRONMENT_PRESENCE_UNKNOWN = 3;
}

// Identifies a newly connected Supervisor process and its host boot.
message SupervisorHello {
  // Stable id for this transport message. UUIDv7 is expected.
  string message_id = 1;
  // Fresh id for this Supervisor process instance. UUIDv7 is expected.
  string supervisor_instance_id = 2;
  // Stable id of the execution host known to Core.
  string host_id = 3;
  // Host boot identifier used during recovery reconciliation.
  string boot_id = 4;
  // The highest protocol major version supported by this Supervisor.
  uint32 protocol_major = 5;
  // Unix epoch milliseconds when the Supervisor process started.
  int64 started_at_unix_ms = 6;
}

// An observed, non-authoritative runtime event for one provisioned Run.
message ObservedRunEvent {
  // Stable id for this transport message. UUIDv7 is expected.
  string message_id = 1;
  // The Run observed by the Supervisor.
  string run_id = 2;
  // The active Lease fencing token. Core rejects stale write scopes.
  uint64 lease_fencing_token = 3;
  // Increases each time Core asks the Supervisor to provision a new environment
  // for this Run.
  uint64 environment_epoch = 4;
  // Strictly increases across ObservedRunEvent and ExecutorSubmission for this
  // (run_id, environment_epoch) pair. Inspection replies are independently scoped.
  uint64 sequence = 5;
  // When the observation occurred, expressed as Unix epoch milliseconds.
  int64 occurred_at_unix_ms = 6;
  // The observed runtime state or incident class.
  RunEventKind kind = 7;
  // Valid UTF-8 JSON object with event-specific, non-secret technical details.
  string details_json = 8;
}

// Runtime observations emitted by the Supervisor. A stage result is not a
// RunEvent; it is sent as an ExecutorSubmission.
enum RunEventKind {
  RUN_EVENT_KIND_UNSPECIFIED = 0;
  RUN_EVENT_KIND_PROVISIONING = 1;
  RUN_EVENT_KIND_RUNNING = 2;
  RUN_EVENT_KIND_HEARTBEAT = 3;
  RUN_EVENT_KIND_STOPPING = 4;
  RUN_EVENT_KIND_STOPPED = 5;
  RUN_EVENT_KIND_START_FAILED = 6;
  RUN_EVENT_KIND_PROVIDER_FAILED = 7;
  RUN_EVENT_KIND_BUDGET_EXHAUSTED = 8;
  RUN_EVENT_KIND_ENVIRONMENT_LOST = 9;
  RUN_EVENT_KIND_POLICY_DENIED = 10;
}

// A typed, fenced submission emitted by an executor running under Supervisor.
// Core validates the Run, Lease, epoch, sequence, capability, and Pipeline
// contract before turning this into a canonical command.
message ExecutorSubmission {
  // Stable id for this transport message. UUIDv7 is expected.
  string message_id = 1;
  // The Run on whose behalf the executor is submitting.
  string run_id = 2;
  // The active Lease fencing token.
  uint64 lease_fencing_token = 3;
  // The currently provisioned environment epoch.
  uint64 environment_epoch = 4;
  // Strictly increasing run-scoped sequence shared with ObservedRunEvent.
  uint64 sequence = 5;
  // When the executor made the submission, as Unix epoch milliseconds.
  int64 submitted_at_unix_ms = 6;

  oneof payload {
    ArtifactSubmission artifact = 7;
    StageOutcomeSubmission stage_outcome = 8;
  }
}

// Requests attachment of a structured Task Artifact. The textual JSON fields
// are parsed and structurally checked by Core; Supervisor never writes an
// Artifact directly.
message ArtifactSubmission {
  // Project-defined Artifact kind, such as analysis_result or review_report.
  // It must be a stable key: 1..=64 lowercase ASCII characters, beginning
  // with a letter and otherwise containing only letters, digits, or underscores.
  string artifact_kind = 1;
  // Valid UTF-8 JSON object with Artifact metadata.
  string metadata_json = 2;
  // Valid UTF-8 JSON value containing the inline Artifact body for M0. Its
  // UTF-8 encoded JSON document, including syntax, must not exceed 262144
  // bytes. Core owns the authoritative size check.
  string body_json = 3;
  // Non-blank human-readable Artifact title, at most 240 Unicode characters.
  string title = 4;
}

// Requests a Pipeline-defined outcome for the active stage.
message StageOutcomeSubmission {
  // Pinned PipelineVersion stage identifier. It is a stable key with the same
  // 1..=64 lowercase ASCII rule as Artifact kinds.
  string stage_id = 1;
  // Pipeline-defined named outcome, such as passed or changes_requested. It is
  // a stable key with the same 1..=64 lowercase ASCII rule as stage ids.
  string outcome = 2;
  // Existing canonical Artifact IDs already linked to the Task that this
  // outcome explicitly cites as permitted TaskHistory evidence. These are not
  // identities for ArtifactSubmission envelopes emitted by this Run. Core
  // rejects duplicates and never infers citations from the Task's other
  // Artifacts.
  repeated string artifact_ids = 3;
  // Optional human-readable note. It is evidence, never an implicit command.
  string note = 4;
  // Required when the Pipeline transition selected by `outcome` terminates the
  // Task as cancelled. This is a stable Project cancellation-reason key, not a
  // mutable numeric catalog position.
  string cancellation_reason_key = 5;
  // ExecutorSubmission.message_id values for ArtifactSubmission envelopes this
  // outcome explicitly cites from the current Run. Core resolves every value
  // atomically only if it belongs to this exact (run_id, lease_fencing_token,
  // environment_epoch) scope, then attaches the resulting canonical Artifact
  // IDs to the outcome. Core rejects duplicates; omission never cites every
  // ArtifactSubmission from the Run.
  repeated string artifact_submission_message_ids = 6;
  // Explicit full HEAD for a Task-owned Git surface. An outcome carrying this
  // field is only a proposal until post-quiescence verification succeeds.
  string candidate_commit = 7;
}

// Core's desired provision request. RunSpec JSON is opaque and explicitly
// versioned; Supervisor must reject an unsupported version rather than infer a
// different profile.
message ProvisionRun {
  // Stable id for this Core command. UUIDv7 is expected.
  string command_id = 1;
  // Run to provision.
  string run_id = 2;
  // Task that owns the Run.
  string task_id = 3;
  // Employee selected by Core.
  string employee_id = 4;
  // Pinned PipelineVersion stage to execute. It is a stable key with the same
  // 1..=64 lowercase ASCII rule as Artifact kinds.
  string stage_id = 5;
  // Monotonic attempt number for this stage.
  uint32 attempt = 6;
  // Lease fencing token required for any executor submission.
  uint64 lease_fencing_token = 7;
  // Desired environment epoch.
  uint64 environment_epoch = 8;
  // Immutable ContextSnapshot identity.
  string context_snapshot_id = 9;
  // Valid UTF-8 JSON object holding the opaque RunSpec transport view.
  string run_spec_json = 10;
  // Non-zero schema version of `run_spec_json`. M0 uses version 1.
  uint32 run_spec_version = 11;
  // Optional validated W3C trace context; correlation only, never authority.
  string traceparent = 12;
  // Absent only for legacy v1/v2 TaskStage requests. V3 must carry an exact owner.
  oneof assignment {
    TaskStageExecutionAssignment task_stage = 13;
    CommunicationExecutionAssignment communication = 14;
    ResolutionExecutionAssignment resolution = 15;
    HookExecutionAssignment hook = 16;
  }
}

message TaskStageExecutionAssignment { string task_id = 1; string queue_entry_id = 2; string stage_id = 3; }
message CommunicationExecutionAssignment { string assignment_id = 1; string thread_id = 2; string source_message_id = 3; }
message ResolutionExecutionAssignment {
  string escalation_id = 1;
  string assignment_id = 2;
  uint64 lease_generation = 3;
}
message HookExecutionAssignment {
  string invocation_id = 1;
  string task_id = 2;
  string pipeline_version_id = 3;
  string stage_id = 4;
  uint64 stage_visit = 5;
  string candidate_proposal_id = 6;
}

// Requests that the Supervisor stop a provisioned Run. Completion is reported
// by a subsequent ObservedRunEvent rather than assumed from this request.
message StopRun {
  // Stable id for this Core command. UUIDv7 is expected.
  string command_id = 1;
  // Run to stop.
  string run_id = 2;
  // Current Lease fencing token.
  uint64 lease_fencing_token = 3;
  // Current environment epoch.
  uint64 environment_epoch = 4;
  // Graceful or forceful stop behavior selected by Core policy.
  StopMode mode = 5;
  // Stable, non-secret reason code for audit and runtime diagnostics.
  string reason_code = 6;
  // Grace period before force escalation when mode is graceful.
  uint64 grace_period_ms = 7;
}

// The allowed stop modes for a Core stop request.
enum StopMode {
  STOP_MODE_UNSPECIFIED = 0;
  STOP_MODE_GRACEFUL = 1;
  STOP_MODE_FORCE = 2;
}

// Core's durable response to one inbound Supervisor message.
message CoreAcknowledgement {
  // Stable id for this response. UUIDv7 is expected.
  string message_id = 1;
  // The Supervisor message id that this response addresses.
  string acknowledged_message_id = 2;
  // Whether Core accepted, rejected, or recorded the message as stale.
  AcknowledgementDisposition disposition = 3;
  // Stable machine-readable refusal/staleness reason. Empty when accepted.
  string reason_code = 4;
  // Safe operator-facing detail; it must not include credentials or raw logs.
  string message = 5;
}

// How Core handled an inbound Supervisor message.
enum AcknowledgementDisposition {
  ACKNOWLEDGEMENT_DISPOSITION_UNSPECIFIED = 0;
  ACKNOWLEDGEMENT_DISPOSITION_ACCEPTED = 1;
  ACKNOWLEDGEMENT_DISPOSITION_REJECTED = 2;
  ACKNOWLEDGEMENT_DISPOSITION_IGNORED_STALE = 3;
}
